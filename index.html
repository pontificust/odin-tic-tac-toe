<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <main class="main">
        <div class="main__game-scores-wrapper">
            <div class="main__game-score-wrapper">
                <h2 class="main__game-player">PLAYER 1</h2>
                <p class="main__game-score">
                    X:<span data-id="x" class="main__game-score-number">0</span>
                </p>
            </div>
            <div class="main__game-score-wrapper">
                <button data-id="start" class="main__game-button">
                    START
                </button>
                <p class="main__game-score">
                    Draws:<span data-id="draw" class="main__game-score-number">0</span>
                </p>
            </div>
            <div class="main__game-score-wrapper">
                <h2 class="main__game-player">PLAYER 2</h2>
                <p class="main__game-score">
                    O:<span data-id="o" class="main__game-score-number">0</span>
                </p>
            </div>
        </div>
        <div class="main__game-cells-wrapper">
            <ul class="main__game-cells">
            </ul>
            <ul class="main__game-background">
            </ul>
        </div>
        <button data-id="reset" class="main__game-button">
            RESET GAME
        </button>
    </main>
    <script src="js/main.js" type="module"></script>
</body>
</html>
